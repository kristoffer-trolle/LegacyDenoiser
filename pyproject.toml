[project]
name = "legacy-denoiser"
version = "0.1.0"
description = "Denoise legacy camera raw files (Kodak DCS Pro Back DCR, Mamiya ZD MEF, ...) with DxO PureRAW and get DNGs of the original camera back"
readme = "README.md"
authors = [
    { name = "Kristoffer Trolle", email = "kristoffertrolle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imagecodecs<2026.10",
    "imageio>=2.38.1",
    "numpy>=2.5.3",
    "rawpy>=0.27.1",
    "tifffile>=2026.9.20",
]

[project.scripts]
legacy-denoiser = "legacy_denoiser:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
